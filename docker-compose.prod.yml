version: '3.8'

services:
  # MongoDB Database Service - Production
  mongodb:
    image: mongo:7.0-alpine
    container_name: perf-tracker-db-prod
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: performance_tracker
    volumes:
      - mongodb_data_prod:/data/db
      - ./infra/mongo-backup:/data/backup
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service - Production
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    container_name: perf-tracker-api-prod
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/performance_tracker?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=${JWT_EXPIRE:-7d}
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network-prod
    restart: always
    healthcheck:
      test: curl -f http://localhost:5000/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend UI Service - Production
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    container_name: perf-tracker-ui-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_ENV=production
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - app-network-prod
    restart: always

volumes:
  mongodb_data_prod:

networks:
  app-network-prod:
    driver: bridge
